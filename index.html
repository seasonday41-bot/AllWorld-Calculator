<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สูตรแนวทางการวิเคราะห์ - พลังจักรวาล 639</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* ตั้งค่าพื้นหลังโดยใช้ภาพจักรวาลเกลียวคลื่นของคุณ */
  body { 
    background-image: url('https://unsplash.com'); /* เผื่อภาพหลักโหลดช้า */
    background-image: url('image_Va0qGj.png'); /* เปลี่ยนเป็นชื่อไฟล์ภาพจักรวาลของคุณหากรันในเครื่อง */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    padding: 20px; 
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  /* เลเยอร์โปร่งแสงทับพื้นหลังเพื่อความละมุนและอ่านง่าย */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5, 15, 30, 0.4); /* บังแสงพื้นหลังเล็กน้อยเพื่อให้ตัวหนังสือเด่นขึ้น */
    z-index: 0;
    pointer-events: none;
  }

  /* --- ระบบแอนิเมชัน พลังเลขเด่น 639 หมุนวนเปล่งประกาย --- */
  #cosmic-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none; /* เพื่อให้สามารถคลิกปุ่มบนเว็บได้ปกติ */
  }

  /* กล่องโปรแกรมสไตล์โฮโลแกรมกระจกแก้ว (Glassmorphism) เพื่อให้เข้ากับภาพอวกาศ */
  .container { 
    width: 100%;
    max-width: 420px;
    background: rgba(10, 25, 50, 0.7); 
    padding: 25px; 
    border-radius: 20px; 
    border: 1px solid rgba(255, 215, 0, 0.3); /* กรอบทองบางๆ เข้ากับตัวเลขในภาพ */
    box-shadow: 0 0 30px rgba(0, 191, 255, 0.2), inset 0 0 15px rgba(255, 215, 0, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    position: relative;
    z-index: 2; /* อยู่เหนือตัวเลขที่ลอย */
    margin: 40px auto;
  }

  h2 { 
    text-align: center; 
    color: #ffd700; /* สีทองอร่ามแมตช์กับตัวเลขในจักรวาล */
    margin-bottom: 25px; 
    font-size: 24px; 
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    letter-spacing: 1px;
  }

  .form-group { margin-bottom: 18px; }
  label { display: block; margin-bottom: 6px; color: #8bc34a; font-size: 14px; font-weight: 500; }
  
  input { 
    width: 100%; 
    padding: 12px; 
    border-radius: 8px; 
    border: 1px solid rgba(255, 215, 0, 0.4); 
    background: rgba(5, 15, 35, 0.8); 
    color: #fff; 
    text-align: center; 
    font-size: 20px; 
    font-weight: bold; 
    outline: none;
    transition: all 0.3s ease;
  }
  input:focus {
    border-color: #ffd700;
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
  }

  /* ปุ่มกดนีออนทอง-ส้ม เข้ากับแสงศูนย์กลางกาแล็กซี */
  button { 
    width: 100%; 
    padding: 14px; 
    background: linear-gradient(135deg, #ff8c00 0%, #ffd700 100%); 
    border: none; 
    color: #000; 
    font-weight: bold; 
    font-size: 18px; 
    border-radius: 8px; 
    cursor: pointer; 
    margin-top: 10px; 
    box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
    transition: all 0.3s ease;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7);
  }

  .result-box { display: none; margin-top: 25px; border-top: 1px solid rgba(255, 215, 0, 0.2); padding-top: 20px; text-align: center; }
  .section-title { color: #8bc34a; margin: 18px 0 10px 0; font-size: 15px; font-weight: bold; }
  .circle-container { display: flex; gap: 12px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
  
  .circle { background: #ffd700; color: #020813; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; box-shadow: 0 0 12px rgba(255, 215, 0, 0.6); }
  .circle-gray { background: rgba(255,255,255,0.1); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 1px solid rgba(255,255,255,0.2); }
  
  .tag { background: rgba(5, 15, 35, 0.6); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.4); padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: bold; display: inline-block; margin: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<!-- พื้นผิวกราฟิกสำหรับรันเลขมงคล 639 หมุนวน -->
<canvas id="cosmic-canvas"></canvas>

<!-- กล่องโปรแกรมสูตรแนวทางการวิเคราะห์ -->
<div class="container">
  <h2>🌌 สูตรแนวทางการวิเคราะห์ 🌌</h2>
  <div class="form-group">
    <label>ผล 3 ตัวบน (งวดล่าสุด)</label>
    <input type="text" id="top3" maxlength="3" placeholder="เช่น 214">
  </div>
  <div class="form-group">
    <label>ผล 2 ตัวล่าง (งวดล่าสุด)</label>
    <input type="text" id="bot2" maxlength="2" placeholder="เช่น 71">
  </div>
  <button onclick="calculate()">คำนวณแนวทาง</button>

  <div id="resultBox" class="result-box">
    

    <div class="section-title">⚡ วิ่ง - รูด (2 ตัวเด่น)</div>
    <div class="circle-container" id="run_digits"></div>

    <div class="section-title">✨ วิน 6 ตัวเด่น (ไม่ซ้ำ)</div>
    <div class="circle-container" id="win_digits"></div>

    <div class="section-title">🎯 เจาะ 2 ตัว บน/ล่าง (5 หาง - ไม่ซ้ำ/ไม่เบิ้ล)</div>
    <div class="circle-container" id="bot2_tail"></div>
  
     <div class="circle-container" id="top3_tail"></div>
</div>

<script>
// --- โค้ด JavaScript สร้างแอนิเมชันเลข 639 หมุนวนอิงตามเกลียวกาแล็กซี ---
const canvas = document.getElementById('cosmic-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const numbersPool = ['6', '3', '9'];
const particles = [];
const particleCount = 45; // จำนวนหนาแน่นของเลขเด่นที่ลอยวน

class NumberParticle {
  constructor() {
    this.reset();
    // สุ่มตำแหน่งเริ่มต้นให้อยู่ห่างกันกระจายทั่วจอ
    this.angle = Math.random() * Math.PI * 2;
    this.radius = Math.random() * (Math.max(canvas.width, canvas.height) * 0.6);
  }

  reset() {
    this.text = numbersPool[Math.floor(Math.random() * numbersPool.length)];
    this.angle = 0;
    this.radius = Math.max(canvas.width, canvas.height) * 0.6; // เริ่มจากวงนอกสุด
    this.speed = 0.01 + Math.random() * 0.015; // ความเร็วหมุนวน
    this.radialSpeed = 0.5 + Math.random() * 0.8; // ความเร็วในการดึงเข้าจุดศูนย์กลาง
    this.fontSize = 12 + Math.random() * 16;
    this.opacity = 0.1 + Math.random() * 0.6;
  }

  update() {
    this.angle += this.speed; // หมุนรอบจุดศูนย์กลาง
    this.radius -= this.radialSpeed; // ค่อยๆ คลานเข้าตรงกลางตามเกลียวในรูปภาพ

    // ถ้าวิ่งเข้าถึงใจกลางแล้ว ให้รีเซ็ตออกไปอยู่ขอบนอกใหม่เหมือนเดิม
    if (this.radius < 20) {
      this.reset();
    }
  }

  draw() {
    // คำนวณอิงจากจุดกึ่งกลางหน้าจอ
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const x = centerX + Math.cos(this.angle) * this.radius;
    const y = centerY + Math.sin(this.angle) * this.radius;

    ctx.save();
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = '#ffd700'; // สีทองเรืองแสงเข้ากับธีมเกลียว
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff8c00'; // แสงออร่าสีส้มทอง
    ctx.font = `bold ${this.fontSize}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.text, x, y);
    ctx.restore();
  }
}

// สร้างอนุภาคเลข 639 ทั้งหมด
for (let i = 0; i < particleCount; i++) {
  particles.push(new NumberParticle());
}

// Loop รันการขยับหมุนเคลื่อนไหวแบบ Real-time
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animate);
}
animate();

// --- โค้ดส่วนคำนวณสถิติตามระบบเดิมของคุณ ---
function calculate() {
  let top3Str = document.getElementById('top3').value.trim();
  let bot2Str = document.getElementById('bot2').value.trim();

  if(top3Str.length !== 3 || bot2Str.length !== 2 || isNaN(top3Str) || isNaN(bot2Str)) {
    alert('กรุณากรอกข้อมูลตัวเลขให้ถูกต้อง (บน 3 หลัก, ล่าง 2 หลัก)');
    return;
  }

  let r_on = Number(top3Str[0]);
  let s_on = Number(top3Str[1]);
  let n_on = Number(top3Str[2]);
  let s_lang = Number(bot2Str[0]);
  let n_lang = Number(bot2Str[1]);

  let run1 = n_on;
  let run2 = (n_on + 5) % 10;

  let rawWin = [run1, run2, r_on, s_on, s_lang, n_lang];
  let winArray = [];
  
  for(let num of rawWin) {
    if(!winArray.includes(num)) {
      winArray.push(num);
    } else {
      let alternative = (num + 5) % 10;
      if(!winArray.includes(alternative)) {
        winArray.push(alternative);
      } else {
        for(let i = 0; i <= 9; i++) {
          if(!winArray.includes(i)) {
            winArray.push(i);
            break;
          }
        }
      }
    }
  }
  winArray = winArray.slice(0, 6);

  // 1. แสดงผล วิ่ง - รูด
  document.getElementById('run_digits').innerHTML = `
    <div class="circle">${run1}</div>
    <div class="circle">${run2}</div>
  `;

  // 2. แสดงผล วิน 6 ตัวเด่น
  document.getElementById('win_digits').innerHTML = winArray.map(n => `<div class="circle-gray">${n}</div>`).join('');

  // 3. เจาะ 2 ตัว บน/ล่าง
 let tail2Array = [];

for(let i = 0; i < winArray.length; i++){
  for(let j = i + 1; j < winArray.length; j++){
    tail2Array.push(
      `${winArray[i]}${winArray[j]}`
    );
  }
}

tail2Array = tail2Array.slice(0,5);
  document.getElementById('bot2_tail').innerHTML = tail2Array.map(n => `<span class="tag">${n}</span>`).join('');

  // 4. เจาะ 3 ตัวตรง
 let tail3Array = [
 `${winArray[0]}${winArray[1]}${winArray[2]}`,
 `${winArray[0]}${winArray[1]}${winArray[3]}`,
 `${winArray[0]}${winArray[2]}${winArray[4]}`
];
  document.getElementById('top3_tail').innerHTML = tail3Array.map(n => `<span class="tag">${n}</span>`).join('');

  document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
